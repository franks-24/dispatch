<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Dispatch by Franks24 — work moves here</title>
<desc id="desc">Animated Dispatch banner depicting the route from Google sign-in to worker and hiring team workspaces.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08121e"/><stop offset="1" stop-color="#162a39"/></linearGradient>
<linearGradient id="route"><stop stop-color="#b8f477"/><stop offset="1" stop-color="#7ddbd3"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b8f477" stroke-opacity=".09"/></pattern>
</defs>
<rect width="1200" height="340" rx="25" fill="url(#bg)"/>
<rect width="1200" height="340" rx="25" fill="url(#grid)"/>
<circle cx="1000" cy="170" r="210" fill="#b8f477" opacity=".045"/>
<rect x="65" y="49" width="51" height="51" rx="14" fill="#b8f477"/>
<path d="M80 62h10c11 0 18 6 18 13s-7 13-18 13H80Zm11 8v10h2c5 0 7-2 7-5s-2-5-7-5Z" fill="#08121e"/>
<text x="134" y="83" font-family="Arial,sans-serif" fill="#edf3f8" font-size="17" font-weight="700" letter-spacing="3">BY FRANKS24</text>
<text x="65" y="203" font-family="Arial,sans-serif" fill="white" font-size="88" font-weight="800">dispatch<tspan fill="#b8f477">.</tspan></text>
<text x="68" y="246" font-family="Arial,sans-serif" fill="#b8c9d7" font-size="22">One Google account. Every opportunity.</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="714" y="69" width="191" height="78" rx="17" fill="#1d3342" stroke="#4c7b72"/>
<text x="809" y="102" font-size="13" fill="#b8f477" letter-spacing="1">01 / ACCESS</text>
<text x="809" y="126" font-size="19" font-weight="700" fill="#f0f6f8">Google sign-in</text>
<rect x="966" y="36" width="191" height="78" rx="17" fill="#1d3342" stroke="#4c7b72"/>
<text x="1061" y="68" font-size="13" fill="#b8f477" letter-spacing="1">02 / DISCOVER</text>
<text x="1061" y="93" font-size="19" font-weight="700" fill="#f0f6f8">Find opportunities</text>
<rect x="966" y="183" width="191" height="78" rx="17" fill="#1d3342" stroke="#4c7b72"/>
<text x="1061" y="216" font-size="13" fill="#b8f477" letter-spacing="1">03 / HIRE</text>
<text x="1061" y="241" font-size="19" font-weight="700" fill="#f0f6f8">Publish jobs</text>
</g>
<g fill="none" stroke="url(#route)" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round">
<path id="one" d="M904 107C938 107 927 75 965 75"/>
<path id="two" d="M904 107C947 107 913 221 965 221"/>
</g>
<circle r="6" fill="#b8f477"><animateMotion dur="3.7s" repeatCount="indefinite"><mpath href="#one"/></animateMotion></circle>
<circle r="6" fill="#7ddbd3"><animateMotion dur="4.6s" repeatCount="indefinite"><mpath href="#two"/></animateMotion></circle>
<circle cx="117" cy="289" r="6" fill="#b8f477"><animate attributeName="opacity" values="1;.35;1" dur="2.8s" repeatCount="indefinite"/></circle>
<text x="134" y="294" font-family="Arial,sans-serif" fill="#cbd9df" font-size="15">GOOGLE SSO · ONE SIGN-IN / SIGN-UP FLOW</text>
<style>@media (prefers-reduced-motion:reduce){animate,animateMotion{display:none}}</style>
</svg>