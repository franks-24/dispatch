name: Dispatch identity flow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: node --check assets/app.js
      - run: npm run test:onboarding && npm run test:identity:unit
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:identity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-browser-results
          path: test-results/
          retention-days: 14
      - name: Verify public DNS, HTTPS and asset responses
        run: node scripts/verify-dispatch-live.mjs
        env:
          VERIFY_PUBLISHED_SOURCE: ${{ github.event_name == 'push' && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatch-live-verification
          path: dispatch-live-verification.json
          retention-days: 14
