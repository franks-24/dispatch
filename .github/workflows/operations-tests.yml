name: Courier operations and capture regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify driver isolation, transactions, ledger and camera retries
        run: npm run test:operations
      - name: Validate server and browser syntax
        run: |
          node --check delivery-functions/operations-function.js
          node --check workspaces/app.js
          node --check deliveries/app.js
          node --check tests/identity/operations.spec.mjs
      - name: Build closed Firebase staging
        run: node tools/build-firebase-dispatcher.mjs

