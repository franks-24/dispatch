name: Deploy Dispatch to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node for Firebase config validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inject validated public Firebase Web config
        env:
          FIREBASE_WEB_CONFIG_JSON: ${{ vars.FIREBASE_WEB_CONFIG_JSON }}
        run: node tools/write-firebase-config.mjs
      - name: Validate customer preview, Firebase config and delivery client
        run: npm run test:onboarding && npm run test:config && npm run test:deliveries
      - name: Stage public static content only
        run: |
          mkdir -p public
          cp index.html CNAME .nojekyll public/
          cp -R assets deliveries legal public/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
