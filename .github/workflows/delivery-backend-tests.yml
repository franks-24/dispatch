name: Delivery backend tests
on:
  pull_request:
    paths: ['delivery-functions/**', 'deliveries/**', 'dispatcher/**', 'firestore.rules', 'firebase.delivery.json', '.github/workflows/delivery-backend-tests.yml']
  push:
    branches: [main]
    paths: ['delivery-functions/**', 'deliveries/**', 'firestore.rules', 'firebase.delivery.json', '.github/workflows/delivery-backend-tests.yml']
permissions:
  contents: read
concurrency:
  group: delivery-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm install --prefix delivery-functions
      - run: node --test tests/deliveries.test.mjs delivery-functions/tests/service.test.mjs delivery-functions/tests/dispatcher-auth.test.mjs
      - name: Verify Functions export loads without credentials or configuration
        run: node -e "import('./delivery-functions/index.js')"
      - name: Test real Firestore transactions and client denial
        run: npx firebase emulators:exec --only firestore --project demo-franks24-deliveries --config firebase.json "node --test delivery-functions/tests/firestore.test.mjs"
